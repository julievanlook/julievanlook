let currentProject = null
let currentImage = 0

/* MENU */

function toggleMenu(id){

document
.getElementById(id)
.classList
.toggle("active")

}

/* OPEN PROJECT */

function openProject(id){

currentProject = projects[id]

if(!currentProject){

console.log("Project not found:", id)
return

}

currentImage = 0

render()

}

/* RENDER */

function render(){

if(!currentProject) return

/* IMAGE */

if(
currentProject.images &&
currentProject.images.length > 0
){

document
.getElementById("imageContainer")
.style.display = "block"

document
.getElementById("projectImage")
.src =
currentProject.images[currentImage]

}

else{

document
.getElementById("imageContainer")
.style.display = "none"

}

/* TEXT */

document
.getElementById("description")
.innerHTML =

`

<div class="title">

${currentProject.title}

</div>

${currentProject.text}

`

/* CONTROLS */

if(
currentProject.images &&
currentProject.images.length > 1
){

document
.getElementById("controls")
.innerHTML =

`

${currentImage + 1}
of
${currentProject.images.length}

<button onclick="prevImage()">
&lt;
</button>

<button onclick="nextImage()">
&gt;
</button>

`

}

else{

document
.getElementById("controls")
.innerHTML = ""

}

}

/* NEXT IMAGE */

function nextImage(){

if(!currentProject) return

currentImage++

if(currentImage >= currentProject.images.length){

currentImage = 0

}

render()

}

/* PREVIOUS IMAGE */

function prevImage(){

if(!currentProject) return

currentImage--

if(currentImage < 0){

currentImage =
currentProject.images.length - 1

}

render()

}
