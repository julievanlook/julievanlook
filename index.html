<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julie Vanlook</title>

<meta
name="description"
content="Julie Vanlook — visual and olfactory artist">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Times New Roman', serif;
background:white;
color:black;

padding:25px;

font-size:14px;
line-height:1.35;
font-weight:300;

}

.container{

display:flex;
gap:40px;

}

.sidebar{

width:280px;
flex-shrink:0;

}

.name{

font-size:14px;
line-height:0.9;

cursor:pointer;

margin-bottom:20px;

}

.info{

margin-bottom:28px;

}

.menu{

display:flex;
flex-direction:column;
gap:8px;

}

.menu a{

text-decoration:none;
color:black;

cursor:pointer;

display:block;
width:fit-content;

}

.menu a:hover{

opacity:.45;

}

.dropdown{

display:none;

margin-bottom:12px;
padding-left:10px;

}

.dropdown.active{

display:block;

}

.item{

cursor:pointer;

margin-bottom:4px;
width:fit-content;

}

.item:hover{

opacity:.45;

}

.content{

flex:1;
max-width:950px;

}

.image{

display:none;
width:100%;

}

.image img{

width:100%;
display:block;

}

.controls{

margin-top:20px;
margin-bottom:35px;

font-size:14px;

display:flex;
align-items:center;
gap:12px;

}

button{

background:none;
border:none;

cursor:pointer;

font-size:14px;
font-family:inherit;

padding:0;

}

button:hover{

opacity:.45;

}

.description{

max-width:800px;
line-height:1.5;

}

.title{

font-weight:bold;
margin-bottom:10px;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

}

.content{

width:100%;

}

.name{

font-size:40px;

}

}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div
class="name"
onclick="home()">

JULIE VANLOOK

</div>

<div class="info">

VISUAL- AND OLFACTORY ARTIST <br>
BASED IN BRUSSELS (BE)

</div>

<div class="menu">

<!-- WORKS -->

<a onclick="toggleMenu('works')">
WORKS
</a>

<div
id="works"
class="dropdown">

<div
class="item"
onclick="openProject('cesttoi')">

C'EST TOI QUI PARS

</div>

<div
class="item"
onclick="openProject('pearls')">

PINK PEAR(L)S

</div>

<div
class="item"
onclick="openProject('left')">

LEFT

</div>

<div
class="item"
onclick="openProject('memory')">

GRANDPARENTS

</div>

<div
class="item"
onclick="openProject('apreslapluie')">

APRÈS LA PLUIE

</div>

<div
class="item"
onclick="openProject('mange')">

MANGÉ III

</div>

</div>

<!-- SCENTS -->

<a onclick="toggleMenu('scents')">
SCENTS
</a>

<div
id="scents"
class="dropdown">

<div
class="item"
onclick="openProject('gav03')">

g.AV.03

</div>

<div
class="item"
onclick="openProject('gbl04')">

g.BL.04

</div>

<div
class="item"
onclick="openProject('gmb03')">

g.MB.03

</div>

<div
class="item"
onclick="openProject('gna07')">

g.NA.07

</div>

<div
class="item"
onclick="openProject('goh02')">

g.OH.02

</div>

<div
class="item"
onclick="openProject('gslf05')">

g.SLF.05

</div>

<div
class="item"
onclick="openProject('gwo04')">

g.WO.04

</div>

</div>

<!-- ABOUT -->

<a onclick="showAbout()">
ABOUT
</a>

</div>

</div>

<!-- CONTENT -->

<div class="content">

<div
id="imageContainer"
class="image">

<img id="projectImage">

</div>

<div
id="controls"
class="controls">

</div>

<div
id="description"
class="description">

</div>

</div>

</div>

<script>

const projects = {

/* WORKS */

cesttoi: {

images: [
"JULIEVANLLOKR1.jpg",
"JULIEVANLLOKR2.jpg"
],

title: "C'EST TOI QUI PARS, 2026",

text: `

immaterial performance — olfactory installation

<br><br>

06° 00’, variable dimensions

`

},

pearls: {

images: [
"JVpinkpearls.jpg"
],

title: "PINK PEAR(L)S, 2026",

text: `

scent-in-space installation, composed scent g.PP.10

<br><br>

variable dimensions

<br><br>

Presented during Fun Fun,
a collaborative exhibition with Johanna Bulens
at ZSenne Artlab Brussels.

`

},

left: {

images: [
"left.jpg"
],

title: "LEFT",

text: `

Visual work

`

},

memory: {

images: [
"grandparent.jpg"
],

title: "GRANDPARENTS",

text: `

Objects and smell composition.

`

},

apreslapluie: {

images: [
"apreslapluie.jpg"
],

title: "APRÈS LA PLUIE",

text: `

rain-soaked soil, wet stone, softened air

`

},

mange: {

images: [
"mange.jpg"
],

title: "MANGÉ III",

text: `

fruit skin, saliva, warm wood

`

},

/* SCENTS */

gav03: {

images: [
"gav.1.jpg"
],

title: "",

text: `



<br><br>



`

},

gbl04: {
images: [
"gbl.jpg"
],
title: "",

text: `



<br><br>



`

},

gmb03: {

title: "g.MB.03",

text: `

milk, paper, white musk

<br><br>

warmth trapped in fabric folds

`

},

gna07: {

title: "g.NA.07",

text: `

metal, eucalyptus, cold stone

<br><br>

night air entering an empty room

`

},

goh02: {

title: "g.OH.02",

text: `

orange peel, cedar, smoke

<br><br>

a hand opening an old wooden box

`

},

gslf05: {

title: "g.SLF.05",

text: `

skin, dust, iris root

<br><br>

soft light resting on the body

`

},

gwo04: {

title: "g.WO.04",

text: `

burnt wood, resin, dark honey

<br><br>

the remains of a distant fire

`

}

}

let currentProject = null
let currentImage = 0

/* MENU */

function toggleMenu(id){

document
.getElementById(id)
.classList
.toggle("active")

}

/* OPEN PROJECT */

function openProject(id){

currentProject = projects[id]

if(!currentProject){

console.log("Project not found:", id)
return

}

currentImage = 0

render()

}

/* RENDER */

function render(){

if(!currentProject) return

/* IMAGE */

if(
currentProject.images &&
currentProject.images.length > 0
){

document
.getElementById("imageContainer")
.style.display = "block"

document
.getElementById("projectImage")
.src =
currentProject.images[currentImage]

}

else{

document
.getElementById("imageContainer")
.style.display = "none"

}

/* TEXT */

document
.getElementById("description")
.innerHTML =

`

<div class="title">

${currentProject.title}

</div>

${currentProject.text}

`

/* CONTROLS */

if(
currentProject.images &&
currentProject.images.length > 1
){

document
.getElementById("controls")
.innerHTML =

`

${currentImage + 1}
of
${currentProject.images.length}

<button onclick="prevImage()">
&lt;
</button>

<button onclick="nextImage()">
&gt;
</button>

`

}

else{

document
.getElementById("controls")
.innerHTML = ""

}

}

/* NEXT IMAGE */

function nextImage(){

if(!currentProject) return

currentImage++

if(currentImage >= currentProject.images.length){

currentImage = 0

}

render()

}

/* PREVIOUS IMAGE */

function prevImage(){

if(!currentProject) return

currentImage--

if(currentImage < 0){

currentImage =
currentProject.images.length - 1

}

render()

}

/* ABOUT */

function showAbout(){

currentProject = null

document
.getElementById("imageContainer")
.style.display = "none"

document
.getElementById("controls")
.innerHTML = ""

document
.getElementById("description")
.innerHTML =

`
  <p>Exhibitions:</p>
  <br>
        <p><em>Upcoming: As If more Could Save Us</em><br>Kunsthal, Ghent (BE)<br>2026</p>
  <br>
        <p><em>Fun, Fun</em><br>ZSenne Artlab, Brussels (BE)<br>2026</p>
  <br>
        <p><em>All That Was Left Was The Ache</em><br>Pilar, Brussels (BE)<br>2026</p>
  <br>
        <p><em>Everything Has To Go</em><br>Giftshop, Ghent (BE)<br>2025</p>
  <br>
        <p><em>GRAD'show</em><br>Luca School of Arts, Brussels (BE)<br>2025</p>
  <br>
        <p><em>Here Be Dragons</em><br>Luca School of Arts, Brussels (BE)<br>2025</p>
  <br>
        <p><em>Common Grounds</em><br>BacArtLab, Louvain (BE)<br>2024</p>
  <br>
        <p><em>Caravella</em><br>U.square Ixelles, Brussels (BE)<br>2024</p>
    <br>
        <p>Press:</p>
    <br>
        <p>
            <a Interview in Kunstletters Magazine #031 
            </a><br>2025
        </p>
    <br>
        <p>
            <a The Design Class of 2025: The 25 Best Graduation Projects online article by Mies Van Roy Flanders DC
             </a> <br>2025
        </p>
    <br>
        <p>Talks:</p>
    <br><br>
        <p>
            <a Kunstletters live (#031) – in conversation with Emma Vanpaemel
            </a><br>2025
        </p>







`

}

/* HOME */

function home(){

currentProject = null

document
.getElementById("imageContainer")
.style.display = "none"

document
.getElementById("controls")
.innerHTML = ""

document
.getElementById("description")
.innerHTML = ""

}

/* START */

home()

</script>

</body>

</html>
