<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Julie Vanlook</title>

<meta
name="description"
content="Julie Vanlook — visual and olfactory artist">



<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:'Times', 'Times New Roman', serif;

background:white;
color:black;

padding:25px;

font-size:16px;
line-height:1.35;
font-weight: 300;
 

}

.container{

display:flex;
gap:40px;

}

.sidebar{

width:280px;
flex-shrink:0;

}

.name{

font-family:'Times', 'Times New Roman', serif;

font-size:16px;
line-height:1.35;
font-weight: 300;

cursor:pointer;

line-height:.85;

}

.info{

margin-bottom:28px;

}

.menu{

display:flex;
flex-direction:column;

gap:8px;

}

.menu a{

text-decoration:none;

color:black;

cursor:pointer;

display:block;

width:fit-content;

}

.menu a:hover{

opacity:.45;

}

.dropdown{

display:none;

margin-bottom:12px;

padding-left:10px;

}

.dropdown.active{

display:block;

}

.item{

cursor:pointer;

margin-bottom:4px;

width:fit-content;

}

.item:hover{

opacity:.45;

}

.content{

flex:1;

max-width:950px;

}

.image{

display:none;

width:100%;

}

.image img{

width:100%;

display:block;

}

.controls{

margin-top:14px;
margin-bottom:20px;

}

button{

background:none;

border:none;

cursor:pointer;

font-size:15px;

font-family:inherit;

}

button:hover{

opacity:.45;

}

.description{

max-width:800px;

line-height:1.5;

}

.title{

font-weight:bold;

margin-bottom:10px;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

}

.content{

width:100%;

}

.name{

font-size:32pt;

}

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div
class="name"
onclick="home()">

Julie Vanlook

</div>

<div class="info">

visual and olfactory artist<br>
based in Brussels

</div>

<div class="menu">

<a
onclick="toggleMenu('works')">

works

</a>

<div
id="Works"
class="dropdown">

<div
class="item"
onclick="openProject('left')">

Left

</div>

<div
class="item"
onclick="openProject('memory')">

Smell Memory

</div>

<div
class="item"
onclick="openProject('pearls')">

Pink Pear(l)s

</div>

</div>

<a
onclick="toggleMenu('Scents')">

Scents

</a>

<div
id="Scents"
class="dropdown">

<div
class="item"
onclick="openProject('g.AV.03')">

g.AV.03

</div>

<div
class="item"
onclick="openProject('forest')">

Forest Composition

</div>

<div
class="item"
onclick="openProject('mange')">

Mangé III

</div>

</div>

<a
onclick="showAbout()">

about

</a>

</div>

</div>

<div class="content">

<div
id="imageContainer"
class="image">

<img
id="projectImage">

</div>

<div
id="controls"
class="controls">

</div>

<div
id="description"
class="description">

</div>

</div>

</div>

<script>

const projects={

left:{

images:[

"left.jpg",
"leftcloseup.jpg",
"IMG_1940.jpg"

],

title:"LEFT",

text:`

Scent sculpture, 2026

<br><br>

30 × 26 × 110 cm

<br><br>

Research into memory and scent.

`

},

memory:{

images:[

"grandparent.jpg"

],

title:"SMELL MEMORY",

text:`

Scent installation

<br><br>

2025

<br><br>

Objects and smell composition.

`

},

pearls:{

images:[

"pinkpearls.jpg"

],

title:"PINK PEAR(L)S",

text:`

Object work

<br><br>

2026

<br><br>

4 × 4 cm

`

},

amber:{

images:[

"amber.jpg"

],

title:"AMBER MEMORY",

text:`

Olfactory composition

<br><br>

2025

`

},

forest:{

images:[

"forest.jpg"

],

title:"FOREST COMPOSITION",

text:`

Scent study

<br><br>

Natural materials

`

},

mange:{

images:[

"mange.jpg",
"mange2.jpg"

],

title:"MANGÉ III",

text:`

Live scent performance

<br><br>

2025

`

}

}

let currentProject=null

let currentImage=0

function toggleMenu(id){

document
.getElementById(id)
.classList
.toggle("active")

}

function openProject(id){

currentProject=
projects[id]

currentImage=0

render()

}

function render(){

if(!currentProject)return

document
.getElementById(
"imageContainer"
).style.display="block"

document
.getElementById(
"projectImage"
).src=

currentProject
.images[
currentImage
]

document
.getElementById(
"description"
).innerHTML=

`

<div class="title">

${currentProject.title}

</div>

${currentProject.text}

`

if(
currentProject
.images.length>1
){

document
.getElementById(
"controls"
).innerHTML=

`

${currentImage+1}
 / 
${currentProject.images.length}

<button
onclick="prevImage()">

Previous

</button>

|

<button
onclick="nextImage()">

Next

</button>

`

}

else{

document
.getElementById(
"controls"
).innerHTML=""

}

}

function nextImage(){

if(!currentProject)return

currentImage++

if(

currentImage>=
currentProject.images.length

){

currentImage=0

}

render()

}

function prevImage(){

if(!currentProject)return

currentImage--

if(
currentImage<0
){

currentImage=
currentProject.images.length-1

}

render()

}

function showAbout(){

currentProject=null

document
.getElementById(
"imageContainer"
).style.display="none"

document
.getElementById(
"controls"
).innerHTML=""

document
.getElementById(
"description"
).innerHTML=

`

Julie Vanlook

<br><br>

Visual / olfactory artist based in Brussels.

<br><br>

Her work stems from research into scent,
memory and embodiment.

<br><br>

contact@julievanlook.com

`

}

function home(){

currentProject=null

document
.getElementById(
"imageContainer"
).style.display="none"

document
.getElementById(
"controls"
).innerHTML=""

document
.getElementById(
"description"
).innerHTML=""

}

home()

</script>

</body>

</html>
