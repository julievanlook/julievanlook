let currentProject = null

/* MENU */

function toggleMenu(id){

document
.getElementById(id)
.classList
.toggle("active")

}

/* OPEN PROJECT */

function openProject(id){

hideIntro();

currentProject = projects[id]

if(!currentProject){

console.log("Project not found:", id)
return

}

currentImage = 0

render()

}

/* RENDER */

function render(){

if(!currentProject) return

/* IMAGE */

if(
currentProject.images &&
currentProject.images.length > 0
){

document
.getElementById("imageContainer")
.style.display = "block"

document
.getElementById("projectImage")
.src =
currentProject.images[currentImage]

}

else{

document
.getElementById("imageContainer")
.style.display = "none"

}

/* TEXT */

document
.getElementById("description")
.innerHTML =

`
<div class="project-content">

<div class="title">
${currentProject.title}
</div>

<div class="subtitle">
${currentProject.subtitle || ""}
</div>

${currentProject.text}

</div>
`

/* CONTROLS */

if(
currentProject.images &&
currentProject.images.length > 1
){

document
.getElementById("controls")
.innerHTML =

`

${currentImage + 1}
of
${currentProject.images.length}

<button onclick="prevImage()">
&lt;
</button>

<button onclick="nextImage()">
&gt;
</button>

`

}

else{

document
.getElementById("controls")
.innerHTML = ""

}

}

/* NEXT IMAGE */

function nextImage(){

if(!currentProject) return

currentImage++

if(currentImage >= currentProject.images.length){

currentImage = 0

}

render()

}

/* PREVIOUS IMAGE */

function prevImage(){

if(!currentProject) return

currentImage--

if(currentImage < 0){

currentImage =
currentProject.images.length - 1

}

render()

}

<p>
Julie Vanlook (b. 2003) is an olfactory artist based in Brussels. Her practice begins with scent as a material that cannot be fixed, owned, or fully contained. Working through processes of extraction, composition, and diffusion, she creates situations in which invisible traces become temporarily present.
<br><br>
Vanlook’s works unfold through duration, proximity, and encounter. They move between the intimate and the shared, using scent to activate memories, bodies, and spaces without prescribing a singular meaning. By treating smell as both residue and transformation, her practice considers how presence can be sensed through what is already disappearing.</p>
