<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julie Vanlook</title>

<meta
name="description"
content="Julie Vanlook — visual and olfactory artist">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Times New Roman', serif;
background:white;
color:black;

padding:25px;

font-size:14px;
line-height:1.35;
font-weight:300;

}

.container{

display:flex;
gap:40px;

}

.sidebar{

width:280px;
flex-shrink:0;

}

/* NAME */

.name{

font-size:14px;
line-height:0.9;

cursor:pointer;

margin-bottom:20px;

}

/* INFO */

.info{

margin-bottom:28px;

}

/* MENU */

.menu{

display:flex;
flex-direction:column;
gap:8px;

}

.menu a{

text-decoration:none;
color:black;

cursor:pointer;

display:block;
width:fit-content;

}

.menu a:hover{

opacity:.45;

}

.dropdown{

display:none;

margin-bottom:12px;
padding-left:10px;

}

.dropdown.active{

display:block;

}

.item{

cursor:pointer;

margin-bottom:4px;
width:fit-content;

}

.item:hover{

opacity:.45;

}

/* CONTENT */

.content{

flex:1;
max-width:950px;

}

.image{

display:none;
width:100%;

}

.image img{

width:100%;
display:block;

}

.controls{

margin-top:14px;
margin-bottom:20px;

}

button{

background:none;
border:none;

cursor:pointer;

font-size:15px;
font-family:inherit;

}

button:hover{

opacity:.45;

}

.description{

max-width:800px;
line-height:1.5;

}

.title{

font-weight:bold;
margin-bottom:10px;

}

/* MOBILE */

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

}

.content{

width:100%;

}

.name{

font-size:56px;

}

}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<div
class="name"
onclick="home()">

JULIE VANLOOK

</div>

<div class="info">

VISUAL- AND OLFACTORY ARTIST <br>
BASED IN BRUSSELS (BE)

</div>

<div class="menu">

<!-- WORKS -->

<a onclick="toggleMenu('works')">
WORKS
</a>

<div
id="works"
class="dropdown">

<div
class="item"
onclick="openProject('cesttoi')">

C'EST TOI QUI PARS

</div>

<div
class="item"
onclick="openProject('pearls')">

PINK PEAR(L)S

</div>

<div
class="item"
onclick="openProject('left')">

LEFT

</div>

<div
class="item"
onclick="openProject('memory')">

GRANDPARENTS

</div>

<div
class="item"
onclick="openProject('apreslapluie')">

APRÈS LA PLUIE

</div>

<div
class="item"
onclick="openProject('mange')">

MANGÉ III

</div>

</div>

<!-- SCENTS -->

<a onclick="toggleMenu('scents')">
SCENTS
</a>

<div
id="scents"
class="dropdown">

<div
class="item"
onclick="openProject('gav03')">

g.AV.03

</div>

</div>

<!-- ABOUT -->

<a onclick="showAbout()">
ABOUT
</a>

</div>

</div>

<!-- CONTENT -->

<div class="content">

<div
id="imageContainer"
class="image">

<img id="projectImage">

</div>

<div
id="controls"
class="controls">

</div>

<div
id="description"
class="description">

</div>

</div>

</div>

<script>

const projects = {

cesttoi: {

images: [
"left.jpg",
"leftcloseup.jpg",
"IMG_1940.jpg"
],

title: "C'est toi qui pars, 2026",

text: `

immaterial performance — olfactory installation

<br><br>

06° 00’, variable dimensions

<br><br>

A dispersed immaterial installation unfolding across eight rooms at Hoste-House Hasselt, centred on the oscillation between presence and absence.

<br><br>

The work intermittently diffuses the artist’s own body scent, rendering it as a volatile spatial residue.

<br><br>

Neither visible nor graspable, it emerges, disperses, and withdraws.

<br><br>

What remains is the fleeting trace of something already in disappearance.

<br><br>

Supported by Noctua

`

},

left: {

images: [
"left.jpg"
],

title: "LEFT",

text: `

Visual work

<br><br>

2026

`

},

memory: {

images: [
"grandparent.jpg"
],

title: "GRANDPARENTS",

text: `

Scent installation

<br><br>

2025

<br><br>

Objects and smell composition.

`

},

pearls: {

images: [
"pinkpearls.jpg"
],

title: "PINK PEAR(L)S",

text: `

Object work

<br><br>

2026

<br><br>

4 × 4 cm

`

},

apreslapluie: {

images: [
"apreslapluie.jpg"
],

title: "APRÈS LA PLUIE",

text: `

Work description here.

`

},

mange: {

images: [
"mange.jpg"
],

title: "MANGÉ III",

text: `

Work description here.

`

},

gav03: {

images: [
"gav03.jpg"
],

title: "g.AV.03",

text: `

musk, peppermint, tobacco, leather

<br><br>

a closed space
holding smoke,
sugar,
skin

`

}

}

let currentProject = null
let currentImage = 0

/* MENU */

function toggleMenu(id){

document
.getElementById(id)
.classList
.toggle("active")

}

/* OPEN PROJECT */

function openProject(id){

currentProject = projects[id]

if(!currentProject){

console.log("Project not found:", id)
return

}

currentImage = 0

render()

}

/* RENDER */

function render(){

if(!currentProject) return

document
.getElementById("imageContainer")
.style.display = "block"

document
.getElementById("projectImage")
.src =
currentProject.images[currentImage]

document
.getElementById("description")
.innerHTML =

`

<div class="title">

${currentProject.title}

</div>

${currentProject.text}

`

if(currentProject.images.length > 1){

document
.getElementById("controls")
.innerHTML =

`

${currentImage + 1}
/
${currentProject.images.length}

<button onclick="prevImage()">
Previous
</button>

|

<button onclick="nextImage()">
Next
</button>

`

}

else{

document
.getElementById("controls")
.innerHTML = ""

}

}

/* NEXT */

function nextImage(){

if(!currentProject) return

currentImage++

if(currentImage >= currentProject.images.length){

currentImage = 0

}

render()

}

/* PREVIOUS */

function prevImage(){

if(!currentProject) return

currentImage--

if(currentImage < 0){

currentImage =
currentProject.images.length - 1

}

render()

}

/* ABOUT */

function showAbout(){

currentProject = null

document
.getElementById("imageContainer")
.style.display = "none"

document
.getElementById("controls")
.innerHTML = ""

document
.getElementById("description")
.innerHTML =

`

Julie Vanlook

<br><br>

Visual / olfactory artist based in Brussels.

<br><br>

Her work stems from research into scent,
memory and embodiment.

<br><br>

vanlook.julie@gmail.com

`

}

/* HOME */

function home(){

currentProject = null

document
.getElementById("imageContainer")
.style.display = "none"

document
.getElementById("controls")
.innerHTML = ""

document
.getElementById("description")
.innerHTML = ""

}

/* START */

home()

</script>

</body>

</html>
