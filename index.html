<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Julie Vanlook</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family: Helvetica,sans-serif;
background: white;
padding:25px;

}

.container{

display:flex;
gap:40px;

}

.sidebar{

width:300px;

}

.name{

font-weight:bold;

}

.info{

margin-bottom:30px;

}

.menu{

margin-bottom:20px;

}

.menu a{

display:block;

text-decoration:none;
color:black;
margin-bottom:8px;

}

.work-list{

display:none;

}

.work-list.active{

display:block;

}

.work-item{

cursor:pointer;

margin-bottom:5px;

}

.work-item:hover{

opacity:.5;

}

.content{

flex:1;

}

.image{

width:100%;
max-width:900px;

}

.image img{

width:100%;

display:block;

}

.controls{

margin:15px 0;

}

.controls button{

background:none;
border:none;

font-size:16px;

cursor:pointer;

}

.description{

max-width:800px;
line-height:1.4;

}

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div class="name">

Julie Vanlook

</div>

<div class="info">

visual / olfactory artist<br>
Based in Brussels

</div>

<div class="menu">

<a onclick="toggleWorks()">

works

</a>

<div class="work-list" id="works">

<div
class="work-item"
onclick="openProject('left')">

Left

</div>

<div
class="work-item"
onclick="openProject('memory')">

SMELL MEMORY

</div>

<div
class="work-item"
onclick="openProject('pearls')">

PINK PEAR(L)S

</div>

</div>

<a href="/geur">

geur

</a>

<a href="/about">

about

</a>

</div>

</div>

<div class="content">

<div class="image">

<img
id="projectImage"
src="left.jpg">

</div>

<div class="controls">

<span id="counter">

1 / 3

</span>

<button onclick="prevImage()">

Previous

</button>

|

<button onclick="nextImage()">

Next

</button>

</div>

<div
class="description"
id="description">

Klik links op een work.

</div>

</div>

</div>

<script>

let projects={

left:{

images:[
"left.jpg",
"leftcloseup.jpg",
"IMG_1940.jpg"
],

title:"LEFT",

text:"Scent sculpture, 2026."

},

memory:{

images:[
"grandparent.jpg"
],

title:"SMELL MEMORY",

text:"Scent installation 2025."

},

pearls:{

images:[
"pinkpearls.jpg"
],

title:"PINK PEAR(L)S",

text:"Object work 2026."

}

}

let currentProject=null;
let currentImage=0;

function toggleWorks(){

document
.getElementById("works")
.classList
.toggle("active");

}

function openProject(id){

currentProject=projects[id];

currentImage=0;

render();

}

function render(){

if(!currentProject)return;

document
.getElementById("projectImage")
.src=
currentProject.images[currentImage];

document
.getElementById("counter")
.textContent=
`${currentImage+1} / ${currentProject.images.length}`;

document
.getElementById("description")
.innerHTML=`

<b>${currentProject.title}</b>

<br><br>

${currentProject.text}

`;

}

function nextImage(){

if(!currentProject)return;

currentImage++;

if(
currentImage>=currentProject.images.length
){

currentImage=0;

}

render();

}

function prevImage(){

if(!currentProject)return;

currentImage--;

if(currentImage<0){

currentImage=
currentProject.images.length-1;

}

render();

}

</script>

</body>
</html>
