<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julie Vanlook</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Times New Roman", serif;
    background:#f3f3f3;
    color:#111;
    font-size:13px;
    line-height:1.25;
    padding:20px;
}

/* =========================
NAVIGATION
========================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:30px;
}

.site-title{
    font-size:20px;
    font-weight:normal;
}

.about-link{
    text-decoration:none;
    color:#111;
}

.about-link:hover{
    opacity:0.4;
}

/* =========================
LAYOUT
========================= */

.layout{
    display:grid;
    grid-template-columns:
        1fr
        220px;
    gap:60px;
    align-items:start;
}

/* =========================
PROJECT LIST
========================= */

.project-list{
    width:100%;
}

.project-row{
    display:grid;
    grid-template-columns:
        40px
        40px
        1fr;
    gap:10px;
    padding:2px 0;
    text-decoration:none;
    color:#111;
}

.project-row:hover{
    opacity:0.4;
}

.project-year{
    margin-top:18px;
    margin-bottom:6px;
}

.project-title em{
    font-style:italic;
}

/* =========================
RIGHT IMAGES
========================= */

.preview-column{
    position:sticky;
    top:20px;

    display:flex;
    flex-direction:column;
    gap:20px;
}

.preview-column img{
    width:100%;
    display:block;
}

/* =========================
MOBILE
========================= */

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview-column{
        position:relative;
        top:auto;
        max-width:220px;
    }

    .topbar{
        margin-bottom:20px;
    }

    body{
        padding:14px;
        font-size:12px;
    }
}

</style>
</head>

<body>

<div class="topbar">
    <div class="site-title">
        Julie Vanlook
    </div>

    <a href="/about" class="about-link">
        about
    </a>
</div>

<div class="layout">

    <!-- LEFT COLUMN -->
    <div class="project-list">

        <div class="project-year">2026</div>

        <a href="#" class="project-row">
            <div>P</div>
            <div>B</div>
            <div class="project-title">
                <em>Pink Pear(l)s</em>
            </div>
        </a>

        <a href="#" class="project-row">
            <div>P</div>
            <div>B</div>
            <div class="project-title">
                <em>Left</em>
            </div>
        </a>

        <a href="#" class="project-row">
            <div>P</div>
            <div>B</div>
            <div class="project-title">
                <em>Grandparents</em>
            </div>
        </a>

        <a href="#" class="project-row">
            <div>P</div>
            <div>V</div>
            <div class="project-title">
                <em>Mangé III</em>
            </div>
        </a>

        <div class="project-year">2025</div>

        <a href="#" class="project-row">
            <div>P</div>
            <div>B</div>
            <div class="project-title">
                <em>Smell Memory</em>
            </div>
        </a>

        <a href="#" class="project-row">
            <div>S</div>
            <div>F</div>
            <div class="project-title">
                scent compositions
            </div>
        </a>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="preview-column">
        <img src="left.jpg" alt="">
        <img src="pinkpearls.jpg" alt="">
    </div>

</div>

</body>
</html>
